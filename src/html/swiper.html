<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>Swiper</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@14.0.1/swiper-bundle.min.css" />
    <link rel="stylesheet" href="../css/swiper.css" />
    <script src="https://cdn.jsdelivr.net/npm/swiper@14.0.1/swiper-bundle.min.js" defer></script>
    <script src="../js/swiper.js" defer></script>
  </head>

  <body>
    <div class="swiper mySwiper">
      <div class="swiper-wrapper">
        <div class="swiper-slide" style="background-color: pink">
          <!-- <img src="https://picsum.photos/700/500" alt="Slide 1" /> -->
          Slide 1
        </div>
        <div class="swiper-slide" style="background-color: pink">
          <img src="https://picsum.photos/700/500" alt="Slide 2" />
        </div>
        <div class="swiper-slide" style="background-color: yellow">
          <img src="https://picsum.photos/700/500" alt="Slide 3" />
        </div>
        <div class="swiper-slide" style="background-color: green">
          <img src="https://picsum.photos/700/500" alt="Slide 4" />
        </div>
        <div class="swiper-slide" style="background-color: blue">
          <img src="https://picsum.photos/700/500" alt="Slide 5" />
        </div>
      </div>
      <div class="swiper-pagination"></div>
    </div>
  </body>
</html>
