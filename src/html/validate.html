<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>유효성 검사</title>
    <script src="../js/validate.js" defer></script>
    <link rel="stylesheet" href="../css/validate.css" />
  </head>
  <body>
    <main class="validation-card">
      <header class="validation-header">
        <p class="eyebrow">VALIDATION</p>
        <h1>휴대전화 번호 확인</h1>
        <p>하이픈 없이 숫자만 입력해 주세요.</p>
      </header>

      <form id="phone-form" class="input-group">
        <label for="phone">휴대전화 번호</label>
        <div class="input-row">
          <input id="phone" type="tel" inputmode="numeric" maxlength="13" placeholder="010으로 시작하는 11자리" />
          <button id="checkBtn" type="submit">확인</button>
        </div>
      </form>

      <p id="result" class="result" aria-live="polite"></p>
    </main>
  </body>
</html>
